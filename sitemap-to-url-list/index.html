<style>
body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
input, button, textarea { width: 100%; margin-top: 0.5rem; padding: 0.5rem; box-sizing: border-box; }
button { cursor: pointer; }
#output { background: #f5f5f5; padding: 1rem; min-height: 6rem; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 0.9rem; border: 1px solid #ddd; }
#status { margin-top: 0.5rem; font-size: 0.9rem; color: #555; }
#copyBtn { display: none; margin-top: 0.5rem; }
</style>

<h2>Sitemap to URL List</h2>
<p>Paste a sitemap URL to extract all URLs from it as a plain list.</p>
<input type="text" id="urlInput" placeholder="https://example.com/sitemap.xml">
<button id="fetchBtn">Fetch URLs</button>
<div id="status"></div>
<textarea id="output" rows="16" readonly placeholder="URLs will appear here..."></textarea>
<button id="copyBtn">Copy to Clipboard</button>

<script>
const fetchBtn = document.getElementById('fetchBtn');
const copyBtn = document.getElementById('copyBtn');
const urlInput = document.getElementById('urlInput');
const output = document.getElementById('output');
const status = document.getElementById('status');

fetchBtn.addEventListener('click', async () => {
  const sitemapUrl = urlInput.value.trim();
  if (!sitemapUrl) {
    status.textContent = 'Please enter a sitemap URL.';
    return;
  }

  status.textContent = 'Fetching sitemap...';
  output.value = '';
  copyBtn.style.display = 'none';

  try {
    /* const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(sitemapUrl)}`; */
    const res = await fetch(sitemapUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, 'application/xml');

    const parseError = xml.querySelector('parsererror');
    if (parseError) throw new Error('Failed to parse XML. Make sure the URL points to a valid sitemap.');

    const locs = Array.from(xml.querySelectorAll('url > loc, sitemap > loc'));

    if (locs.length === 0) {
      status.textContent = 'No URLs found in the sitemap.';
      return;
    }

    const urls = locs.map(el => el.textContent.trim()).join('\n');
    output.value = urls;
    status.textContent = `Found ${locs.length} URL${locs.length !== 1 ? 's' : ''}.`;
    copyBtn.style.display = 'block';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }
});

copyBtn.addEventListener('click', () => {
  if (!output.value) return;
  navigator.clipboard.writeText(output.value).then(() => {
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = original; }, 1500);
  }).catch(() => {
    output.select();
    document.execCommand('copy');
  });
});

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') fetchBtn.click();
});
</script>
